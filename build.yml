name: Compiler Le Gambleur Fou (Mac et Windows)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: gambleur-fou-${{ runner.os }}
          path: release/*
          if-no-files-found: error
